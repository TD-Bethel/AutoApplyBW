{% extends "base.html" %}
{% block title %}Forgot password, AutoApply BW{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:1.5rem auto">
  <h2>Forgot your password?</h2>
  <p class="muted">Enter your email and we'll send you a link to set a new password.</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <button class="btn" type="submit" style="margin-top:1rem">Send reset link</button>
  </form>
  <p class="muted"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
</div>
{% endblock %}
