{% extends "base.html" %}
{% block title %}Sign up — AutoApply BW{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:1.5rem auto">
  <h2>Create your account</h2>
  <form method="post">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="phone">Phone (optional)</label>
    <input id="phone" name="phone" placeholder="+267 7X XXX XXX">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="8" required>
    <p class="muted" style="font-size:0.85rem">At least 8 characters.</p>
    <button class="btn" type="submit">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
