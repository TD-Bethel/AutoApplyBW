{% extends "base.html" %}
{% block title %}Log in — AutoApply BW{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:1.5rem auto">
  <h2>Log in</h2>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" style="margin-top:1rem">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
</div>
{% endblock %}
