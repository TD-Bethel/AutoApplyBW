{% extends "base.html" %}
{% block title %}Reset password, AutoApply BW{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:1.5rem auto">
  <h2>Choose a new password</h2>
  <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="8"
           autocomplete="new-password" required>
    <label for="confirm">Confirm new password</label>
    <input id="confirm" name="confirm" type="password" minlength="8"
           autocomplete="new-password" required>
    <p class="muted" style="font-size:0.85rem">At least 8 characters.</p>
    <button class="btn" type="submit" style="margin-top:0.5rem">Reset password</button>
  </form>
</div>
{% endblock %}
